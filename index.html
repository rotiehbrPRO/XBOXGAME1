<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Xbox PWA</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111111" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #111;
      --panel: #1b1b1b;
      --btn: #333;
      --btn2: #444;
      --accent: #ff9800;
      --text: #fff;
      --lcd: #0b0b0b;
      --lcdText: #7CFF7C;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .app {
      width: min(92vw, 360px);
      background: var(--panel);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }
    .hint {
      margin: 0 0 12px;
      font-size: 12px;
      opacity: .8;
      text-align: center;
      line-height: 1.4;
    }
    #display {
      width: 100%;
      min-height: 68px;
      border: 0;
      border-radius: 14px;
      background: var(--lcd);
      color: var(--lcdText);
      font-size: 30px;
      font-weight: 700;
      padding: 14px 16px;
      margin-bottom: 14px;
      text-align: right;
      overflow: hidden;
      word-break: break-all;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      height: 60px;
      font-size: 20px;
      background: var(--btn);
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: scale(.98); }
    .selected {
      background: var(--accent) !important;
      color: #111;
      outline: 3px solid rgba(255,152,0,.25);
    }
    .wide { grid-column: span 2; }
    .op { background: var(--btn2); }
  </style>
</head>
<body>
  <main class="app">
    <h1>Calculadora Xbox</h1>
    <p class="hint">D-Pad para mover • A = escolher • B = limpar • X = apagar • Y = igual</p>

    <div id="display">0</div>

    <div class="grid" id="grid">
      <button>7</button><button>8</button><button>9</button><button class="op">/</button>
      <button>4</button><button>5</button><button>6</button><button class="op">*</button>
      <button>1</button><button>2</button><button>3</button><button class="op">-</button>
      <button>0</button><button>.</button><button class="op">=</button><button class="op">+</button>
    </div>
  </main>

  <script>
    const display = document.getElementById("display");
    const buttons = Array.from(document.querySelectorAll("button"));
    let index = 0;
    let lastPadState = { up:false, down:false, left:false, right:false, a:false, b:false, x:false, y:false };

    buttons[index].classList.add("selected");

    function updateSelection(newIndex) {
      buttons[index].classList.remove("selected");
      index = (newIndex + buttons.length) % buttons.length;
      buttons[index].classList.add("selected");
    }

    function safeEval(expr) {
      if (!/^[0-9+\-*/.() ]+$/.test(expr)) throw new Error("Invalid expression");
      return Function("return (" + expr + ")")();
    }

    function press(val) {
      if (val === "=") {
        try {
          const result = safeEval(display.textContent);
          display.textContent = String(result);
        } catch (e) {
          display.textContent = "Erro";
        }
        return;
      }

      if (display.textContent === "0" || display.textContent === "Erro") {
        display.textContent = "";
      }
      display.textContent += val;
    }

    function clearDisplay() {
      display.textContent = "0";
    }

    function backspace() {
      display.textContent = display.textContent.slice(0, -1) || "0";
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => press(btn.textContent));
    });

    function handlePadButton(current, prev) {
      return current && !prev;
    }

    function loop() {
      const gp = navigator.getGamepads && navigator.getGamepads()[0];
      if (gp) {
        const up = !!gp.buttons[12]?.pressed;
        const down = !!gp.buttons[13]?.pressed;
        const left = !!gp.buttons[14]?.pressed;
        const right = !!gp.buttons[15]?.pressed;
        const a = !!gp.buttons[0]?.pressed;
        const b = !!gp.buttons[1]?.pressed;
        const x = !!gp.buttons[2]?.pressed;
        const y = !!gp.buttons[3]?.pressed;

        if (handlePadButton(up, lastPadState.up)) updateSelection(index - 4);
        if (handlePadButton(down, lastPadState.down)) updateSelection(index + 4);
        if (handlePadButton(left, lastPadState.left)) updateSelection(index - 1);
        if (handlePadButton(right, lastPadState.right)) updateSelection(index + 1);

        if (handlePadButton(a, lastPadState.a)) press(buttons[index].textContent);
        if (handlePadButton(b, lastPadState.b)) clearDisplay();
        if (handlePadButton(x, lastPadState.x)) backspace();
        if (handlePadButton(y, lastPadState.y)) press("=");

        lastPadState = { up, down, left, right, a, b, x, y };
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener("gamepadconnected", () => requestAnimationFrame(loop));

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
